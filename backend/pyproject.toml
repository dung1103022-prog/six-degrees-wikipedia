[project]
name = "sixth-degree-backend"
version = "0.1.0"
description = "Six Degrees of Wikipedia (Python) — backend. Contract: ../SPEC.md"
requires-python = ">=3.12"
# Pinned to the versions verified by the Phase 1 test suite (SPEC §0.2).
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "starlette==1.6.0",
  "uvicorn==0.53.0",
  # Transitive dependency of starlette, pinned explicitly (SPEC §9, N-1): anyio 4.15.0 made
  # `anyio.abc.BlockingPortal` a deprecated alias that warns on access, and starlette 1.6.0
  # (the latest release) still accesses it that way at import time of starlette.testclient.
  # 4.14.2 is the release before that alias was introduced; it still satisfies starlette's
  # `anyio<5,>=3.6.2` and httpx2's `anyio>=4.10`.
  "anyio==4.14.2",
]

[project.optional-dependencies]
# Only fetcher.py (Phase 3, run by hand on the operator's machine) needs httpx; the production
# runtime never calls Wikipedia (SPEC ADR-009), so it is not a runtime dependency.
fetcher = [
  "httpx==0.28.1",
]
test = [
  "pytest==9.1.1",
  # fetcher tests (test_fetcher.py, fakewiki.py) import httpx directly to mock its transport.
  "httpx==0.28.1",
  # starlette.testclient (SPEC §9, N-1) prefers httpx2 and warns when it falls back to httpx;
  # installing it removes that warning. Only used through fastapi.testclient.TestClient.
  "httpx2==2.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
  "spec(test_id): links a test to a test ID in SPEC.md §7 (SPEC §0.2)",
]
